# model_aliases block for ~/.hermes/config.yaml (v2 flat schema)
#
# A global alias table: declare once, use anywhere. Every provider your config
# references gets the table automatically — the provider child-prop of each
# block decides which catalog the alias resolves against:
#
#   model:      { provider: opencode-go, default: glm-latest }   # real name + alias
#   auxiliary.anything: { provider: opencode-go, model: glm-latest }
#   fallback_providers: [{ provider: opencode-go, model: glm-latest }]
#
# There are no targets, no alias-* profiles, and no provider prefixes.

model_aliases:
  # wrap_all: true   # also wrap providers not referenced in config (eager, parallel)

  glm-latest:
    match: ["glm-*"]
    exclude: ["*-preview"]        # never floats onto previews
    # filter:
    #   minContext: 128000
    #   minAge: 48h                # skip models released < 48h ago
    #   capabilities: { tools: true, input: [text] }
    # select: { strategy: latest } # default; only strategy supported

  gemini-flash-lite-latest:
    match: ["gemini-*-flash-lite"]

  kimi-code-latest:
    match: ["kimi-*-code"]

  mimo-pro-latest:
    match: ["mimo-*-pro"]

  mimo-flash-latest:
    match: ["mimo-*-flash"]

  minimax-latest:
    match: ["minimax-*"]

  minimax-flash-latest:
    match: ["minimax-*-flash"]
